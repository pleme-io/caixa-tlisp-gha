name: auto-release

# The canonical 3-line polymorphic shim. detect-repo-type resolves this repo to
# `caixa` from its *.caixa.lisp manifest, and auto-release dispatches to
# caixa-tlisp-auto-release.yml.
#
# The polymorphic dispatcher could not route anything until 2026-07-29:
# tatara-script forwards a script's GITHUB_OUTPUT keys through an explicit
# allow-list of composite outputs, and repo-type was not on it, so
# detect-repo-type's answer was dropped at the composite boundary and every
# arm compared against an empty string. Fixed in pleme-io/actions 15ea377.
# First green dispatch through this path: run on 281bb46.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

jobs:
  release:
    uses: pleme-io/substrate/.github/workflows/auto-release.yml@main
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
    secrets: inherit
