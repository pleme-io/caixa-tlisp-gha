name: auto-release

# The canonical 3-line polymorphic shim. detect-repo-type resolves this repo to
# `caixa` from its *.caixa.lisp manifest, and auto-release dispatches to
# caixa-tlisp-auto-release.yml.
#
# This repo previously called the composites directly, because the polymorphic
# workflow startup_failure'd with zero jobs for every caller in the org: GitHub
# validates the whole reusable call graph before evaluating any job `if:`, so
# `required: true` secrets in the rust/cargo/npm/python arms failed repos that
# would never reach them. Fixed in substrate a599f11.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

jobs:
  release:
    uses: pleme-io/substrate/.github/workflows/auto-release-min.yml@bisect-startup
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
    secrets: inherit
